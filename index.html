<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bautizo de Ethan | Invitación Especial para Padrinos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pergamino: {
                            50: '#FDFBF7',
                            100: '#F9F4EC',
                            200: '#F2E9DC',
                            300: '#E5D6C3',
                        },
                        blueFloral: {
                            100: '#EBF2F7',
                            500: '#4A7C99',
                            600: '#355C7D',
                            700: '#23395B',
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        cursive: ['"Great Vibes"', 'cursive'],
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    animation: {
                        'delayed-fade': 'fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'delayed-slide': 'slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(25px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #F4EFE6;
            background-image: radial-gradient(#E5D6C3 0.75px, transparent 0.75px), radial-gradient(#E5D6C3 0.75px, #F4EFE6 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #2C3E50;
            overflow-x: hidden;
        }
        .parchment-card {
            background: #FDFBF7;
            border: 1px solid #E5D6C3;
            box-shadow: 0 20px 40px rgba(53, 92, 125, 0.08);
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
